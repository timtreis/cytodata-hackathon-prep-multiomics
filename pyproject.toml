[project]
name = "cytodata-hackathon-prep-multiomics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anndata",
  "matplotlib",
  "mantispy[map]>=0.1.0a2",
  "pooch",
  "pytest",
  "scanpy",
  "scikit-learn",
  "spatialdata>=0.7.2",
]

[tool.uv]
package = false

[dependency-groups]
prep = ["nbconvert", "ipykernel"]
